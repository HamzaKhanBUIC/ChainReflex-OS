services:
  - type: web
    name: chainreflex-core
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.gateway.api:api --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: HF_TOKEN
        sync: false
